name: Bug report
description: Report reproducible incorrect behavior in CGP.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CGP. Remove secrets and personal data from every example, log, and attachment.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets, personal data, and customer information.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: CGP/FCP version, release, or commit SHA.
      placeholder: 0.1, master@abcdef0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Protocol or schema
        - Reference server
        - CLI
        - Privacy gateway
        - Conformance suite
        - Website or documentation
        - CI or packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, a minimal sanitized fixture, or a repository link.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go/Node versions, deployment mode, and relevant local tools.
      placeholder: Ubuntu 24.04, amd64, Go 1.23, Node 22
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Sanitized logs, screenshots, or suspected cause.
