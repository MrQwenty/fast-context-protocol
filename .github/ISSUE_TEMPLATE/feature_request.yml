name: Feature request
description: Propose an implementation or developer-experience improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request does not require disclosing private or regulated data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem or workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and developer experience.
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Who benefits?
      description: Describe users, implementations, or deployment environments affected.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility, privacy, and security impact
      description: Explain any wire, migration, data-handling, or trust-boundary implications.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Benchmarks, prior art, standards, or example integrations.
