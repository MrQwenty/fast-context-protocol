name: Documentation
description: Report missing, unclear, incorrect, or outdated documentation.
title: "docs: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: website/src/content/docs/privacy/anonymization.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Typo or formatting
        - Missing example
        - Incorrect technical behavior
        - Misleading security or privacy claim
        - Misleading regulatory claim
        - Broken navigation or website
        - Other
    validations:
      required: true
