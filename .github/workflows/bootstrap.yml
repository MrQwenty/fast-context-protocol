name: Apply FCP release bundle

on:
  push:
    branches: [master]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: fcp-release-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply release bundle
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G 'bootstrap/chunk-*' >/dev/null; then
            echo 'Bundle already applied.'
            exit 0
          fi
          cat bootstrap/chunk-* | base64 --decode > /tmp/fcp-release.tar.xz
          echo '3e6df15ff63d2f4dbc9555f5b40575e124a1713f004935e6dbd7e843bcd7b48c  /tmp/fcp-release.tar.xz' | sha256sum --check --strict
          xz --test /tmp/fcp-release.tar.xz
          tar --extract --xz --file /tmp/fcp-release.tar.xz --directory .
          rm -rf bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: complete FCP ecosystem foundation'
          git push origin HEAD:master
