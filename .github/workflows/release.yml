name: Progressive Release

on:
  pull_request_target:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional commit SHA to release; defaults to master
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: progressive-release-master
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.target_sha }}" ]]; then
            echo "sha=${{ inputs.target_sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            echo "sha=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout merged code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: true

      - name: Determine progressive version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          target_sha="$(git rev-parse HEAD)"

          existing_tag="$(git tag --points-at "$target_sha" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [[ -n "$existing_tag" ]]; then
            version="$existing_tag"
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ -z "$latest_tag" ]]; then
              version="v0.1.0"
            elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              version="v${major}.${minor}.$((patch + 1))"
            else
              echo "Unsupported latest tag format: $latest_tag" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $target_sha"

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version_number="${VERSION#v}"
          rm -rf dist
          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )
          commands=(fcpd fcpctl fcpconform fcpprivacy)

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            package_dir="dist/cgp_${version_number}_${goos}_${goarch}"
            mkdir -p "$package_dir"

            for command in "${commands[@]}"; do
              output="$package_dir/$command"
              if [[ "$goos" == "windows" ]]; then
                output="${output}.exe"
              fi
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags="-s -w" -o "$output" "./cmd/$command"
            done

            cp README.md LICENSE "$package_dir/"

            if [[ "$goos" == "windows" ]]; then
              archive="dist/cgp_${version_number}_${goos}_${goarch}.zip"
              (cd dist && zip -qr "$(basename "$archive")" "$(basename "$package_dir")")
            else
              archive="dist/cgp_${version_number}_${goos}_${goarch}.tar.gz"
              tar -C dist -czf "$archive" "$(basename "$package_dir")"
            fi
            rm -rf "$package_dir"
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.version.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; reusing it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$TARGET_SHA" -m "CGP $VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.version.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to publish."
            exit 0
          fi

          note="Automated progressive release"
          if [[ -n "${PR_NUMBER:-}" ]]; then
            note="Released after merging #${PR_NUMBER}: ${PR_TITLE}"
          fi

          gh release create "$VERSION" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/SHA256SUMS \
            --target "$TARGET_SHA" \
            --title "CGP $VERSION" \
            --notes "$note" \
            --generate-notes \
            --prerelease \
            --fail-on-no-commits
